# LOCAL DEV ONLY: Postgres for `bun run dev` / `bun test`. The API is never run in Docker (it is one Bun process;
# mediasoup is a worker inside it). Production: see deploy/ (systemd + Caddy, no Docker).
services:
  db:
    # Postgres 17 + pg_cron (a clock) + pgmq (a message queue), on the same Alpine base as postgres:17-alpine (see db/Dockerfile).
    # Without them the API falls back to its own timer and an in-memory raise-hand queue.
    build: ./db
    image: yspace-postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=yspace"]
    environment:
      POSTGRES_USER: yspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: yspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    # loopback only: for local dev, tests and psql. Never exposed to the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yspace -d yspace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
